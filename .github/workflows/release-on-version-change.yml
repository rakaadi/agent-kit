name: Release on Version Change

'on':
  pull_request:
    branches:
      - main
    paths:
      - plugin.json
  push:
    branches:
      - main
    paths:
      - plugin.json

concurrency:
  group: release-on-version-change-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate proposed version
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          current_version="$(node -p "JSON.parse(require('fs').readFileSync('plugin.json', 'utf8')).version")"
          base_version="$(git show "${BASE_SHA}:plugin.json" | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data).version));')"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          tag="v${current_version}"

          if [[ ! "${current_version}" =~ ${semver_pattern} ]]; then
            echo "::error title=Invalid version::plugin.json version ${current_version} is not valid Semantic Versioning."
            exit 1
          fi

          if [ "${current_version}" = "${base_version}" ]; then
            echo "::error title=Version unchanged::plugin.json changed, but its version remains ${current_version}."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error title=Tag already exists::${tag} already exists on origin."
            exit 1
          fi

          {
            echo "### Release validation passed"
            echo
            echo "- Previous version: ${base_version}"
            echo "- Proposed version: ${current_version}"
            echo "- Pending tag: ${tag}"
          } >> "${GITHUB_STEP_SUMMARY}"

  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_version="$(node -p "JSON.parse(require('fs').readFileSync('plugin.json', 'utf8')).version")"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          tag="v${current_version}"

          if [[ ! "${current_version}" =~ ${semver_pattern} ]]; then
            echo "::error title=Invalid version::plugin.json version ${current_version} is not valid Semantic Versioning."
            exit 1
          fi

          if [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "::error title=Missing previous revision::Cannot determine whether plugin.json version changed."
            exit 1
          fi

          previous_version="$(git show "${BEFORE_SHA}:plugin.json" | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data).version));')"

          if [ "${current_version}" = "${previous_version}" ]; then
            echo "plugin.json version remains ${current_version}; no release is needed."
            exit 0
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; no release is needed."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --verify-tag --title "${tag}" --generate-notes
          else
            gh release create "${tag}" --target "${CURRENT_SHA}" --title "${tag}" --generate-notes
          fi

          {
            echo "### Release created"
            echo
            echo "- Previous version: ${previous_version}"
            echo "- Released version: ${current_version}"
            echo "- Tag: ${tag}"
          } >> "${GITHUB_STEP_SUMMARY}"
